recipe: default.v1
assistant_id: marketing-bot

# Le bot comprend le français et l'anglais avec le même modèle.
# Ce pipeline ne dépend d'aucune langue (pas de spaCy à installer).
language: fr

pipeline:
  - name: WhitespaceTokenizer
  - name: RegexFeaturizer
  - name: LexicalSyntacticFeaturizer
  - name: CountVectorsFeaturizer
  - name: CountVectorsFeaturizer
    analyzer: char_wb
    min_ngram: 1
    max_ngram: 4
  - name: DIETClassifier
    epochs: 100
    constrain_similarities: true
  - name: FallbackClassifier
    threshold: 0.4
    ambiguity_threshold: 0.1

policies:
  - name: RulePolicy
    core_fallback_threshold: 0.4
    core_fallback_action_name: utter_fallback
    enable_fallback_prediction: true
